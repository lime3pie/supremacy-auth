@if (visible) {
  <div class="health-dev-row" [title]="reason" (click)="openDialog()">
    <span class="hd-value">{{ projectedHp | number:'1.0-1' }}</span>
    <span class="hd-change" [class.health-up]="direction === 'up'" [class.health-down]="direction === 'down'">
      @if (direction === 'up') { ▲ }
      @if (direction === 'down') { ▼ }
      {{ hpChange | number:'1.0-1' }}
    </span>
  </div>
}
