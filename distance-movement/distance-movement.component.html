<app-dialog [show]="showDialog" [title]="'Distance Movement'" (close)="close()" [draggable]="true" [showBackdrop]="false">
  <div class="distance-movement-container">
    <p>Select an army in-game to track its movement.</p>

    <div class="input-group">
      <label for="targetDistance">Target Distance (km):</label>
      <input id="targetDistance" type="number" [(ngModel)]="targetDistance" min="0" placeholder="Enter distance" />
    </div>

    <div class="input-group">
      <label for="distanceActionMode">On reach:</label>
      <select id="distanceActionMode" [(ngModel)]="distanceActionMode" [disabled]="trackingActive">
        <option value="stop">Stop army</option>
        <option value="update">Send update</option>
      </select>
    </div>

    <div *ngIf="currentDistance !== null" class="distance-display">
      Current Distance: {{ currentDistance | number:'1.2-2' }} km
    </div>

    <div *ngIf="commandDistances.length > 0" class="command-list">
      <div class="command-item" *ngFor="let command of commandDistances">
        <div class="command-header">Command {{ command.index }}:</div>
        <div>Cumulative distance: {{ command.cumulativeDistance | number:'1.2-2' }} km</div>
      </div>
    </div>

    <div class="button-group">
      <button (click)="toggleTracking()">
        {{ trackingActive ? 'Stop Tracking' : 'Start Tracking' }}
      </button>
      <button (click)="close()">Close</button>
    </div>
  </div>
</app-dialog>
