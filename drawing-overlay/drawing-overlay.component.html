<ng-container *ngIf="viewModel && !viewModel.collapsed">
  <div
    #shellRef
    class="overlay-shell"
    [style.top.px]="position.top"
    [style.left.px]="position.left"
    [style.width.px]="size.width"
    [style.height.px]="size.height"
  >
    <header
      class="overlay-header"
      (pointerdown)="startDrag($event)"
      [class.dragging]="isDragging"
    >
      <div class="title-block">
        <!-- <span class="overline">Field tools</span> -->
        <h2 class="title">Drawing Overlay</h2>
      </div>
      <button
        type="button"
        class="icon-button"
        (click)="toggleCollapsed()"
        aria-label="Hide drawing overlay"
      >
        <span class="close-icon">&times;</span>
      </button>
    </header>

    <section class="overlay-body">
      <div class="tip-banner">
        <div class="tip-line">
          <span class="tip-label">Draw</span>
          <span class="tip-kbd">
            <span>Alt</span>
            <span class="sep">+</span>
            <span>Drag</span>
          </span>
        </div>
        <div class="tip-line">
          <span class="tip-label">Erase</span>
          <span class="tip-kbd">
            <span>Alt</span>
            <span class="sep">+</span>
            <span>Right Click</span>
          </span>
        </div>
      </div>

      <div class="command-grid">
        <button
          type="button"
          class="command-btn"
          (click)="toggleGrid()"
          [class.active]="viewModel?.gridEnabled"
        >
          <span class="command-title">Grid</span>
          <span class="command-state">{{
            viewModel?.gridEnabled ? "On" : "Off"
          }}</span>
        </button>
        <button
          type="button"
          class="command-btn"
          (click)="clearMyDrawings()"
          [disabled]="!viewModel?.hasDrawings"
        >
          <span class="command-title">Clear</span>
          <span class="command-state">My Lines</span>
        </button>
      </div>

      <div class="visibility-toggle">
        <span class="visibility-label">Show drawings:</span>
        <button
          type="button"
          class="visibility-option"
          [class.active]="isVisibilityMode('always')"
          (click)="setVisibilityMode('always')"
        >
          On
        </button>
        <button
          type="button"
          class="visibility-option"
          [class.active]="isVisibilityMode('overlay')"
          (click)="setVisibilityMode('overlay')"
        >
          In menu only
        </button>
        <button
          type="button"
          class="visibility-option"
          [class.active]="isVisibilityMode('off')"
          (click)="setVisibilityMode('off')"
        >
          Off
        </button>
      </div>

      <div class="drawing-mode-toggle">
        <span class="drawing-mode-label">Draw mode:</span>
        <div class="drawing-mode-buttons">
          <button
            type="button"
            class="drawing-mode-option"
            [class.active]="isDrawingMode('freehand')"
            (click)="setDrawingMode('freehand')"
          >
            Freehand
          </button>
          <button
            type="button"
            class="drawing-mode-option"
            [class.active]="isDrawingMode('circle')"
            (click)="setDrawingMode('circle')"
          >
            Circle
          </button>
        </div>
        <div class="drawing-mode-hint" *ngIf="isDrawingMode('circle')">
          Alt + scroll to adjust size
        </div>
      </div>

      <section class="players-section" *ngIf="viewModel?.players?.length">
        <div class="players-header">
          <span class="section-title">Participants</span>
          <span class="badge">{{ viewModel?.players?.length }}</span>
        </div>

        <div
          class="players-list"
          [style.height.px]="playerListHeight"
          [style.maxHeight.px]="playersListMaxHeightCap"
        >
          <label class="player-row" *ngFor="let player of viewModel?.players">
            <span
              class="color-swatch"
              [style.background]="player.color || '#888'"
            ></span>
            <span class="player-name">#{{ player.playerID }}</span>
            <span class="player-name">#{{ player.name }}</span>
            <span class="spacer"></span>
            <input
              type="checkbox"
              [checked]="!player.hidden"
              (change)="togglePlayer(player.playerID)"
            />
          </label>
        </div>
      </section>

      <div class="empty-state" *ngIf="!viewModel?.players?.length">
        Awaiting commanders to join the battlemap.
      </div>
    </section>
    <div class="overlay-error" *ngIf="showConnectionError()">
      <div class="error-card">
        <p>{{ viewModel?.connectionErrorMessage }}</p>
        <button type="button" (click)="acknowledgeConnectionError()">OK</button>
      </div>
    </div>
  </div>
</ng-container>
